---
- name: Create service directory
  ansible.builtin.file:
    path: "{{ beets_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Create config directory
  ansible.builtin.file:
    path: "{{ beets_dir }}/config"
    state: directory
    owner: "1000"
    group: "1000"
    mode: "0755"

- name: Create inbox directory
  ansible.builtin.file:
    path: "{{ beets_dir }}/inbox"
    state: directory
    owner: "1000"
    group: "1000"
    mode: "0755"

- name: Deploy beets config
  ansible.builtin.template:
    src: beets-config.yaml.j2
    dest: "{{ beets_dir }}/config/config.yaml"
    owner: "1000"
    group: "1000"
    mode: "0644"
  notify: Deploy beets

- name: Deploy import script
  ansible.builtin.template:
    src: import.sh.j2
    dest: "{{ beets_dir }}/import.sh"
    owner: root
    group: root
    mode: "0755"

- name: Deploy compose file
  ansible.builtin.template:
    src: compose.yaml.j2
    dest: "{{ beets_dir }}/compose.yaml"
    owner: root
    group: root
    mode: "0644"
  notify: Deploy beets

- name: Apply beets deployment now (if changed)
  ansible.builtin.meta: flush_handlers

- name: Install import service unit
  ansible.builtin.template:
    src: rpi-beets-import.service.j2
    dest: /etc/systemd/system/rpi-beets-import.service
    owner: root
    group: root
    mode: "0644"

- name: Install import path unit
  ansible.builtin.template:
    src: rpi-beets-import.path.j2
    dest: /etc/systemd/system/rpi-beets-import.path
    owner: root
    group: root
    mode: "0644"

- name: Enable beets inbox watcher
  ansible.builtin.systemd:
    name: rpi-beets-import.path
    enabled: true
    state: started
    daemon_reload: true
  when: not ansible_check_mode

- name: Check beets import pipeline
  ansible.builtin.systemd:
    name: rpi-beets-import.service
    state: started
  changed_when: false
  when: not ansible_check_mode
