---
- name: Create service directory
  ansible.builtin.file:
    path: "{{ beszel_dir }}"
    state: directory
    mode: "0755"

- name: Deploy compose file
  ansible.builtin.template:
    src: compose.yaml.j2
    dest: "{{ beszel_dir }}/compose.yaml"
    mode: "0644"
  notify: Deploy beszel

- name: Apply beszel deployment now (if changed)
  ansible.builtin.meta: flush_handlers

- name: Check Beszel hub responds
  ansible.builtin.uri:
    url: "http://localhost:{{ beszel_port }}/"
    status_code: 200
  register: beszel_health
  retries: 12
  delay: 10
  until: beszel_health.status == 200
  when: not ansible_check_mode
