---
- name: Enable memory cgroup on boot
  ansible.builtin.replace:
    path: /boot/firmware/cmdline.txt
    regexp: '^((?!.*\bcgroup_enable=memory\b).+)$'
    replace: '\1 cgroup_enable=memory'

- name: Limit journald size on SD card
  ansible.builtin.copy:
    src: journald-rpi.conf
    dest: /etc/systemd/journald.conf.d/rpi.conf
    mode: "0644"
  notify: Restart journald

- name: Enable periodic apt update and upgrade
  ansible.builtin.copy:
    src: apt-20auto-upgrades
    dest: /etc/apt/apt.conf.d/20auto-upgrades
    mode: "0644"

- name: Install unattended-upgrades origins config
  ansible.builtin.copy:
    src: apt-50unattended-upgrades
    dest: /etc/apt/apt.conf.d/50unattended-upgrades
    mode: "0644"

- name: Install LAN firewall script
  ansible.builtin.copy:
    src: firewall-rpi.sh
    dest: /usr/local/sbin/firewall-rpi.sh
    mode: "0755"
    owner: root
    group: root
  notify: Restart rpi-firewall

- name: Install LAN firewall service unit
  ansible.builtin.copy:
    src: rpi-firewall.service
    dest: /etc/systemd/system/rpi-firewall.service
    mode: "0644"
    owner: root
    group: root
  notify: Restart rpi-firewall

- name: Enable LAN firewall at boot
  ansible.builtin.systemd:
    name: rpi-firewall.service
    enabled: true
    state: started
    daemon_reload: true
  when: not ansible_check_mode
