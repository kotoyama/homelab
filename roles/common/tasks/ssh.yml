---
- name: Forbid root SSH login
  ansible.builtin.copy:
    src: sshd-rpi.conf
    dest: /etc/ssh/sshd_config.d/rpi.conf
    owner: root
    group: root
    mode: "0644"
  notify: Reload ssh

- name: Create .ssh directory
  ansible.builtin.file:
    path: "{{ user_home_dir }}/.ssh"
    state: directory
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    mode: "0700"

- name: Install authorized_keys
  ansible.builtin.copy:
    src: authorized_keys
    dest: "{{ user_home_dir }}/.ssh/authorized_keys"
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    mode: "0600"
