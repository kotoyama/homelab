map $uri $error_page_path {
    default         /en/404.html;
    ~^/ru/          /ru/404.html;
}

server {
    listen 80;
    server_name rpi4.local;

    # use relative redirects
    absolute_redirect off;

    root /usr/share/nginx/html;

    # hide server version
    server_tokens off;

    # gzip compression
    gzip on;
    gzip_vary on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types
        text/plain
        text/xml
        text/css
        text/javascript
        application/json
        application/javascript
        application/xml
        application/rss+xml
        application/atom+xml
        image/svg+xml;

    # security headers
    include /etc/nginx/security-headers.conf;

    # HTML: revalidate every request (site updates hourly — long cache would serve stale pages)
    add_header Cache-Control "no-cache" always;

    location = / {
        return 301 /en/;
    }

    # deny access to hidden files
    location ~ /\. {
        deny all;
    }

    # custom 404 error page
    error_page 404 $error_page_path;
    location ~ ^/(en|ru)/404\.html$ {
        internal;
    }

    # versioned static assets — safe to cache long
    location ~* \.(?:css|js|svg|png|ico|gif|jpe?g|webp|avif|ttf|woff2?)$ {
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "public, max-age=2592000, immutable" always;
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
