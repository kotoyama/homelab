---
- name: Create service directory
  ansible.builtin.file:
    path: "{{ pihole_dir }}"
    state: directory
    mode: "0755"

- name: Deploy .env with admin password
  ansible.builtin.template:
    src: env.j2
    dest: "{{ pihole_dir }}/.env"
    owner: root
    group: root
    mode: "0600"
  no_log: true
  notify: Deploy pihole

- name: Deploy compose file
  ansible.builtin.template:
    src: compose.yaml.j2
    dest: "{{ pihole_dir }}/compose.yaml"
    mode: "0644"
  notify: Deploy pihole

- name: Apply pihole deployment now (if changed)
  ansible.builtin.meta: flush_handlers

- name: Check Pi-hole admin API responds
  ansible.builtin.uri:
    url: "http://localhost:{{ pihole_http_port }}/api/auth"
    status_code: [200, 401]
  register: pihole_health
  retries: 12
  delay: 10
  until: pihole_health.status in [200, 401]
  when: not ansible_check_mode
