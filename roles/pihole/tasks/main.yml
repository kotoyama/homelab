---
- name: Create service directory
  ansible.builtin.file:
    path: "{{ pihole_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Create unbound config directory
  ansible.builtin.file:
    path: "{{ pihole_dir }}/unbound"
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Create pihole data directory
  ansible.builtin.file:
    path: "{{ pihole_dir }}/etc"
    state: directory
    owner: "1000"
    group: "1000"
    mode: "0755"

- name: Deploy .env with admin password
  ansible.builtin.template:
    src: env.j2
    dest: "{{ pihole_dir }}/.env"
    owner: root
    group: root
    mode: "0600"
  no_log: true
  notify: Deploy pihole

- name: Deploy compose file
  ansible.builtin.template:
    src: compose.yaml.j2
    dest: "{{ pihole_dir }}/compose.yaml"
    owner: root
    group: root
    mode: "0644"
  notify: Deploy pihole

- name: Deploy unbound forwarder config
  ansible.builtin.template:
    src: forwarder.conf.j2
    dest: "{{ pihole_dir }}/unbound/forwarder.conf"
    owner: root
    group: root
    mode: "0644"
  notify: Deploy pihole

- name: Apply pihole deployment now (if changed)
  ansible.builtin.meta: flush_handlers

- name: Check Pi-hole admin API responds
  ansible.builtin.uri:
    url: "http://localhost:{{ pihole_http_port }}/api/auth"
    status_code: [200, 401]
  register: pihole_health
  retries: 12
  delay: 10
  until: pihole_health.status in [200, 401]
  when: not ansible_check_mode

- name: Check DNSSEC resolution through unbound
  community.docker.docker_container_exec:
    container: pihole
    argv:
      - dig
      - "@unbound"
      - -p
      - "{{ pihole_unbound_port }}"
      - +dnssec
      - +time=3
      - +tries=1
      - dnssec.works
  register: pihole_unbound_dns
  retries: 6
  delay: 10
  until: "'status: NOERROR' in pihole_unbound_dns.stdout and ' ad' in pihole_unbound_dns.stdout"
  changed_when: false
  when: not ansible_check_mode

- name: Check DNSSEC resolution through Pi-hole
  community.docker.docker_container_exec:
    container: pihole
    argv:
      - dig
      - "@127.0.0.1"
      - +dnssec
      - +time=3
      - +tries=1
      - example.com
  register: pihole_dns
  retries: 6
  delay: 10
  until: "'status: NOERROR' in pihole_dns.stdout and ' ad' in pihole_dns.stdout"
  changed_when: false
  when: not ansible_check_mode
