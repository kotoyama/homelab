---
- name: Create backup script directory
  ansible.builtin.file:
    path: "{{ backup_script_dir }}"
    state: directory
    mode: "0755"
    owner: root
    group: root

- name: Create pihole backup directory
  ansible.builtin.file:
    path: "{{ backups_dir }}/pihole"
    state: directory
    mode: "0700"
    owner: root
    group: root

- name: Create compose backup directories
  ansible.builtin.file:
    path: "{{ backups_dir }}/{{ item.name }}"
    state: directory
    mode: "0700"
    owner: root
    group: root
  loop: "{{ backup_compose_services }}"

- name: Install shared backup library
  ansible.builtin.copy:
    src: lib.sh
    dest: "{{ backup_script_dir }}/lib.sh"
    mode: "0755"
    owner: root
    group: root

- name: Download rclone deb
  ansible.builtin.get_url:
    url: "https://downloads.rclone.org/v{{ backup_rclone_version }}/rclone-v{{ backup_rclone_version }}-linux-arm64.deb"
    dest: "{{ backup_rclone_deb_path }}"
    mode: "0644"
    owner: root
    group: root
    checksum: "sha256:{{ backup_rclone_version_sha256 }}"

- name: Install rclone
  ansible.builtin.apt:
    deb: "{{ backup_rclone_deb_path }}"

- name: Create rclone config directory
  ansible.builtin.file:
    path: /root/.config/rclone
    state: directory
    mode: "0700"
    owner: root
    group: root

- name: Deploy rclone env file
  ansible.builtin.template:
    src: rclone.env.j2
    dest: /root/.config/rclone/rclone.env
    mode: "0600"
    owner: root
    group: root
  no_log: true

- name: Remove stray rclone config file
  ansible.builtin.file:
    path: /root/.config/rclone/rclone.conf
    state: absent

- name: Set up pihole backup
  ansible.builtin.import_tasks: pihole.yml

- name: Set up compose service backups
  ansible.builtin.include_tasks: compose-backup.yml

- name: Set up cloud backup sync
  ansible.builtin.import_tasks: cloud-sync.yml
