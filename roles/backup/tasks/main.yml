---
- name: Create backup script directory
  ansible.builtin.file:
    path: "{{ backup_script_dir }}"
    state: directory
    mode: "0755"

- name: Install backup script
  ansible.builtin.template:
    src: backup-pihole.sh.j2
    dest: "{{ backup_script_dir }}/backup-pihole.sh"
    mode: "0755"

- name: Install backup service unit
  ansible.builtin.template:
    src: rpi-backup-pihole.service.j2
    dest: /etc/systemd/system/rpi-backup-pihole.service
    mode: "0644"

- name: Install backup timer unit
  ansible.builtin.copy:
    src: rpi-backup-pihole.timer
    dest: /etc/systemd/system/rpi-backup-pihole.timer
    mode: "0644"

- name: Enable nightly backup timer
  ansible.builtin.systemd:
    name: rpi-backup-pihole.timer
    enabled: true
    state: started
    daemon_reload: true
