---
- name: Create service directory
  ansible.builtin.file:
    path: "{{ forgejo_dir }}"
    state: directory
    mode: "0755"

- name: Deploy compose file
  ansible.builtin.template:
    src: compose.yaml.j2
    dest: "{{ forgejo_dir }}/compose.yaml"
    mode: "0644"
  notify: Deploy forgejo

- name: Apply forgejo deployment now (if changed)
  ansible.builtin.meta: flush_handlers

- name: Check Forgejo web responds
  ansible.builtin.uri:
    url: "http://localhost:{{ forgejo_port }}/"
    status_code: 200
  register: forgejo_health
  retries: 12
  delay: 10
  until: forgejo_health.status == 200
  when: not ansible_check_mode

- name: Create mirror script directory
  ansible.builtin.file:
    path: "{{ forgejo_script_dir }}"
    state: directory
    mode: "0755"
    owner: root
    group: root

- name: Install Forgejo mirror seeder script
  ansible.builtin.copy:
    src: rpi-forgejo-mirror.sh
    dest: "{{ forgejo_script_dir }}/rpi-forgejo-mirror.sh"
    mode: "0755"
    owner: root
    group: root

- name: Deploy Forgejo mirror seeder env file
  ansible.builtin.template:
    src: forgejo-mirror.env.j2
    dest: "{{ forgejo_dir }}/mirror.env"
    mode: "0600"
    owner: root
    group: root
  no_log: true

- name: Install Forgejo mirror seeder service unit
  ansible.builtin.template:
    src: rpi-forgejo-mirror.service.j2
    dest: /etc/systemd/system/rpi-forgejo-mirror.service
    mode: "0644"
    owner: root
    group: root

- name: Install Forgejo mirror seeder timer unit
  ansible.builtin.copy:
    src: rpi-forgejo-mirror.timer
    dest: /etc/systemd/system/rpi-forgejo-mirror.timer
    mode: "0644"
    owner: root
    group: root

- name: Enable weekly Forgejo mirror seeding
  ansible.builtin.systemd:
    name: rpi-forgejo-mirror.timer
    enabled: true
    state: started
    daemon_reload: true
  when: not ansible_check_mode
